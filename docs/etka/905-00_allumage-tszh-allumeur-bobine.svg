<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <defs>
    <style>
      .etka-bg { fill: #f8fafc; }
      .etka-title { font-family: ui-monospace, monospace; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .etka-subtitle { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .etka-leader { stroke: #dc2626; stroke-width: 1.3; fill: none; }
      .etka-leader-dot { fill: #dc2626; }
      .etka-bubble { fill: #dc2626; stroke: #ffffff; stroke-width: 1.5; }
      .etka-bubble-num { font-family: ui-monospace, monospace; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .etka-card-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .etka-tbl-hdr { font-family: ui-monospace, monospace; font-size: 11px; font-weight: bold; fill: #334155; }
      .etka-tbl-row { font-family: ui-monospace, monospace; font-size: 10.5px; fill: #475569; }
      .etka-tbl-ref { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="960" height="680" class="etka-bg" />
  <rect x="16" y="16" width="928" height="648" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="20" y="20" width="920" height="640" fill="none" stroke="#cbd5e1" stroke-width="0.8" />

  <path d="M 20 62 L 940 62" stroke="#94a3b8" stroke-width="1.2" />
  <text x="36" y="42" class="etka-title">AUDI 80 / 90 / AVANT (1987-1991) · GROUPE 9 : ÉQUIPEMENT ÉLECTRIQUE</text>
  <text x="36" y="56" class="etka-subtitle">PLANCHE ISOMÉTRIQUE ATELIER N° 905-00 · SYSTÈME D'ALLUMAGE TSZ-H (ALLUMEUR HALL, MODULE 191 905 351 B, BOBINE HT)</text>
  <text x="760" y="46" font-family="ui-monospace, monospace" font-size="13px" font-weight="bold" fill="#dc2626">BILDTAFEL 905-00</text>

  <!-- ==================== VUE ÉCLATÉE ISOMÉTRIQUE ==================== -->
  <g transform="translate(40, 20)">

    <!-- Tête d'allumeur (Repère 3 : 026 905 207) en haut -->
    <g id="part-3-cap" transform="translate(180, 80)">
      <polygon points="20,10 60,0 80,15 40,25" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.8" />
      <polygon points="20,10 20,45 40,60 40,25" fill="#991b1b" stroke="#450a0a" stroke-width="1.8" />
      <polygon points="40,25 40,60 80,50 80,15" fill="#b91c1c" stroke="#450a0a" stroke-width="1.8" />
      <!-- 4 plots HT latéraux + 1 plot central -->
      <cylinder cx="50" cy="8" r="4" />
      <rect x="46" y="-8" width="8" height="15" fill="#1e293b" stroke="#000000" stroke-width="1.2" />
      <rect x="25" y="5" width="6" height="12" fill="#1e293b" stroke="#000000" stroke-width="1.2" />
      <rect x="68" y="5" width="6" height="12" fill="#1e293b" stroke="#000000" stroke-width="1.2" />
      <rect x="35" y="18" width="6" height="12" fill="#1e293b" stroke="#000000" stroke-width="1.2" />
    </g>

    <!-- Axe vertical d'explosion -->
    <line x1="230" y1="150" x2="230" y2="210" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Doigt d'allumeur (Repère 2 : 052 905 225 C) -->
    <g id="part-2-rotor" transform="translate(200, 190)">
      <polygon points="10,15 30,5 50,15 30,25" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
      <polygon points="10,15 10,25 30,35 30,25" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" />
      <polygon points="30,25 30,35 50,25 50,15" fill="#c2410c" stroke="#9a3412" stroke-width="1.5" />
      <!-- Contact cuivre / résistance 1kΩ -->
      <line x1="30" y1="15" x2="48" y2="6" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <line x1="230" y1="235" x2="230" y2="270" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Allumeur Hall avec capsule à dépression (Repère 1 : 026 905 205 AA) -->
    <g id="part-1-distributor" transform="translate(170, 260)">
      <!-- Corps alu d'allumeur -->
      <ellipse cx="60" cy="30" rx="35" ry="18" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
      <polygon points="25,30 25,75 95,75 95,30" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <ellipse cx="60" cy="75" rx="35" ry="18" fill="#64748b" stroke="#334155" stroke-width="2" />
      <!-- Tige inférieure et pignon d'entraînement hélicoïdal -->
      <rect x="52" y="75" width="16" height="55" fill="#475569" stroke="#1e293b" stroke-width="1.5" />
      <!-- Pignon avec cannelures -->
      <rect x="50" y="130" width="20" height="20" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
      <line x1="53" y1="130" x2="57" y2="150" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="60" y1="130" x2="64" y2="150" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="67" y1="130" x2="71" y2="150" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Capsule d'avance à dépression latérale (vers carbu Keihin) -->
      <ellipse cx="115" cy="40" rx="18" ry="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.5" />
      <line x1="90" y1="38" x2="105" y2="39" stroke="#334155" stroke-width="2" />
      <rect x="130" y="38" width="10" height="4" fill="#94a3b8" stroke="#334155" stroke-width="1" />
      <!-- Prise 3 broches capteur Hall (+, 0, -) -->
      <polygon points="12,45 28,40 28,58 12,63" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
      <circle cx="17" cy="52" r="1.5" fill="#f8fafc" />
      <circle cx="20" cy="51" r="1.5" fill="#f8fafc" />
      <circle cx="23" cy="50" r="1.5" fill="#f8fafc" />
    </g>

    <!-- Bobine cylindrique HT (Repère 5 : 867 905 104 A) -->
    <g id="part-5-coil" transform="translate(390, 160)">
      <!-- Corps cylindrique noir/alu -->
      <ellipse cx="35" cy="20" rx="28" ry="14" fill="#64748b" stroke="#1e293b" stroke-width="2" />
      <polygon points="7,20 7,95 63,95 63,20" fill="#334155" stroke="#1e293b" stroke-width="2" />
      <ellipse cx="35" cy="95" rx="28" ry="14" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <!-- Tour centrale HT (vers tête delco) -->
      <rect x="29" y="0" width="12" height="20" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
      <!-- Borne 15 (+12V APC ro/sw) -->
      <circle cx="16" cy="18" r="3" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
      <text x="13" y="12" font-family="ui-monospace, monospace" font-size="7" font-weight="bold" fill="#0f172a">15</text>
      <!-- Borne 1 (Signal négatif / compte-tours gn) -->
      <circle cx="54" cy="18" r="3" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <text x="52" y="12" font-family="ui-monospace, monospace" font-size="7" font-weight="bold" fill="#0f172a">1</text>
      <!-- Bride de fixation avec vis M6 à la caisse -->
      <path d="M 0 55 L 7 55 M 63 55 L 70 55" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Module d'allumage électronique TSZ-H (Repère 6 : 191 905 351 B) -->
    <g id="part-6-tszh" transform="translate(360, 360)">
      <!-- Dissipateur thermique en aluminium avec ailettes -->
      <polygon points="0,35 60,10 140,40 80,65" fill="#94a3b8" stroke="#334155" stroke-width="1.8" />
      <polygon points="0,35 0,55 80,85 80,65" fill="#64748b" stroke="#334155" stroke-width="1.8" />
      <polygon points="80,65 80,85 140,60 140,40" fill="#475569" stroke="#334155" stroke-width="1.8" />
      <!-- Boîtier noir du module Telefunken/Bosch -->
      <polygon points="15,35 55,18 115,40 75,57" fill="#0f172a" stroke="#000000" stroke-width="1.8" />
      <text x="45" y="42" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#f8fafc" transform="rotate(18, 45, 42)">TSZ-H</text>
      <text x="40" y="52" font-family="ui-monospace, monospace" font-size="6.5" fill="#94a3b8" transform="rotate(18, 40, 52)">191 905 351 B</text>
      <!-- Prise 7 broches verrouillée -->
      <polygon points="85,55 125,38 135,46 95,63" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <!-- Faisceau 7 fils vers allumeur & bobine -->
      <path d="M 95 63 Q 110 95 130 130" stroke="#1e293b" stroke-width="6" fill="none" />
    </g>

    <!-- ==================== BULLES ET LIGNES ETKA ==================== -->
    <!-- Repère 3 : Tête -->
    <line x1="90" y1="110" x2="190" y2="105" class="etka-leader" />
    <circle cx="190" cy="105" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="110" r="13" class="etka-bubble" />
    <text x="75" y="110" class="etka-bubble-num">3</text>

    <!-- Repère 2 : Doigt rotor -->
    <line x1="90" y1="200" x2="210" y2="205" class="etka-leader" />
    <circle cx="210" cy="205" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="200" r="13" class="etka-bubble" />
    <text x="75" y="200" class="etka-bubble-num">2</text>

    <!-- Repère 1 : Allumeur Hall -->
    <line x1="90" y1="310" x2="180" y2="310" class="etka-leader" />
    <circle cx="180" cy="310" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="310" r="13" class="etka-bubble" />
    <text x="75" y="310" class="etka-bubble-num">1</text>

    <!-- Repère 5 : Bobine HT -->
    <line x1="510" y1="190" x2="435" y2="195" class="etka-leader" />
    <circle cx="435" cy="195" r="3" class="etka-leader-dot" />
    <circle cx="525" cy="190" r="13" class="etka-bubble" />
    <text x="525" y="190" class="etka-bubble-num">5</text>

    <!-- Repère 6 : Module TSZ-H -->
    <line x1="510" y1="380" x2="440" y2="390" class="etka-leader" />
    <circle cx="440" cy="390" r="3" class="etka-leader-dot" />
    <circle cx="525" cy="380" r="13" class="etka-bubble" />
    <text x="525" y="380" class="etka-bubble-num">6</text>

  </g>

  <!-- ==================== NOMENCLATURE OFFICIELLE VAG ==================== -->
  <g transform="translate(615, 80)">
    <rect width="310" height="560" class="etka-card-box" />
    <rect width="310" height="30" fill="#f1f5f9" rx="6" />
    <text x="12" y="20" class="etka-tbl-hdr">NOMENCLATURE PIÈCES · BILDTAFEL 905-00</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#cbd5e1" />

    <text x="12" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">REP</text>
    <text x="44" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">RÉFÉRENCE OEM</text>
    <text x="170" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">DÉSIGNATION</text>
    <line x1="0" y1="52" x2="310" y2="52" stroke="#e2e8f0" />

    <!-- Ligne 1 : Allumeur -->
    <text x="16" y="74" class="etka-tbl-ref">1</text>
    <text x="44" y="74" class="etka-tbl-ref">026 905 205 AA</text>
    <text x="170" y="74" class="etka-tbl-row">Allumeur complet</text>
    <text x="44" y="87" class="etka-subtitle">Zündverteiler Hallgeber (Bosch)</text>
    <line x1="8" y1="94" x2="302" y2="94" stroke="#f1f5f9" />

    <!-- Ligne 2 : Doigt rotor -->
    <text x="16" y="112" class="etka-tbl-ref">2</text>
    <text x="44" y="112" class="etka-tbl-ref">052 905 225 C</text>
    <text x="170" y="112" class="etka-tbl-row">Doigt d'allumeur</text>
    <text x="44" y="125" class="etka-subtitle">Verteilerläufer 1kΩ</text>
    <line x1="8" y1="132" x2="302" y2="132" stroke="#f1f5f9" />

    <!-- Ligne 3 : Tête -->
    <text x="16" y="150" class="etka-tbl-ref">3</text>
    <text x="44" y="150" class="etka-tbl-ref">026 905 207</text>
    <text x="170" y="150" class="etka-tbl-row">Tête d'allumeur</text>
    <text x="44" y="163" class="etka-subtitle">Verteilerkappe (Delco)</text>
    <line x1="8" y1="170" x2="302" y2="170" stroke="#f1f5f9" />

    <!-- Ligne 5 : Bobine -->
    <text x="16" y="188" class="etka-tbl-ref">5</text>
    <text x="44" y="188" class="etka-tbl-ref">867 905 104 A</text>
    <text x="170" y="188" class="etka-tbl-row">Bobine allumage</text>
    <text x="44" y="201" class="etka-subtitle">Zündspule zylindrisch</text>
    <line x1="8" y1="208" x2="302" y2="208" stroke="#f1f5f9" />

    <!-- Ligne 6 : Module TSZ-H -->
    <text x="16" y="226" class="etka-tbl-ref">6</text>
    <text x="44" y="226" class="etka-tbl-ref">191 905 351 B</text>
    <text x="170" y="226" class="etka-tbl-row">Module TSZ-H</text>
    <text x="44" y="239" class="etka-subtitle">Schaltgerät für Transistorzündung</text>
    <line x1="8" y1="246" x2="302" y2="246" stroke="#f1f5f9" />

    <!-- Guide diagnostic allumage / TSZ-H -->
    <g transform="translate(10, 270)">
      <rect width="290" height="275" fill="#eff6ff" stroke="#bfdbfe" rx="5" />
      <text x="10" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#1e40af">PROTOCOLE TEST TSZ-H (RTA 9 &amp; 10)</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Alimentation bobine : Borne 15 = 12V contact mis</text>
      <text x="10" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Résistance primaire bobine (bornes 1-15) :</text>
      <text x="10" y="62" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">   0.52 à 0.76 Ω à 20°C</text>
      <text x="10" y="76" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Résistance secondaire (bornes 1-4 HT) :</text>
      <text x="10" y="90" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">   2400 à 3500 Ω</text>
      <text x="10" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Alimentation Capteur Hall (broches + et -) :</text>
      <text x="10" y="118" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">   Minimum 9.0 V (délivré par module TSZ-H)</text>
      <text x="10" y="132" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Signal Hall (broche 0 centrale et masse) :</text>
      <text x="10" y="146" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">   Oscillation 0V &lt;-&gt; 5V en tournant le moteur</text>
      <text x="10" y="160" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Emplacement physique module TSZ-H :</text>
      <text x="10" y="174" font-family="ui-monospace, monospace" font-size="9" fill="#475569">   Sous le tableau de bord, vissé contre le montant</text>
      <text x="10" y="188" font-family="ui-monospace, monospace" font-size="9" fill="#475569">   de baie / pied avant gauche (dissipation caisse)</text>
      <text x="10" y="202" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Signal compte-tours : prélevé sur borne 1</text>
      <text x="10" y="216" font-family="ui-monospace, monospace" font-size="9" fill="#475569">   traverse le tablier vers T26/5 (fil vert)</text>
      <text x="10" y="234" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• RTA page 9 : Schéma allumeur et contrôles</text>
      <text x="10" y="248" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• RTA page 10 : Calage initial 18° ± 1° à 900 tr/min</text>
    </g>
  </g>
</svg>
