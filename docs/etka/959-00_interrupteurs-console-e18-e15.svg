<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <defs>
    <style>
      .etka-bg { fill: #f8fafc; }
      .etka-title { font-family: ui-monospace, monospace; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .etka-subtitle { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .etka-leader { stroke: #dc2626; stroke-width: 1.3; fill: none; }
      .etka-leader-dot { fill: #dc2626; }
      .etka-bubble { fill: #dc2626; stroke: #ffffff; stroke-width: 1.5; }
      .etka-bubble-num { font-family: ui-monospace, monospace; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .etka-card-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .etka-tbl-hdr { font-family: ui-monospace, monospace; font-size: 11px; font-weight: bold; fill: #334155; }
      .etka-tbl-row { font-family: ui-monospace, monospace; font-size: 10.5px; fill: #475569; }
      .etka-tbl-ref { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="960" height="680" class="etka-bg" />
  <rect x="16" y="16" width="928" height="648" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="20" y="20" width="920" height="640" fill="none" stroke="#cbd5e1" stroke-width="0.8" />

  <path d="M 20 62 L 940 62" stroke="#94a3b8" stroke-width="1.2" />
  <text x="36" y="42" class="etka-title">AUDI 80 / 90 / AVANT (1987-1991) · GROUPE 9 : ÉQUIPEMENT ÉLECTRIQUE</text>
  <text x="36" y="56" class="etka-subtitle">PLANCHE ISOMÉTRIQUE ATELIER N° 959-00 · INTERRUPTEURS CONSOLE CENTRALE (ANTIBROUILLARD E18, DÉGIVRAGE E15, WARNING E3)</text>
  <text x="760" y="46" font-family="ui-monospace, monospace" font-size="13px" font-weight="bold" fill="#dc2626">BILDTAFEL 959-00</text>

  <!-- ==================== VUE ÉCLATÉE ISOMÉTRIQUE ==================== -->
  <g transform="translate(40, 20)">

    <!-- Repère 1 : Cadre support console centrale (893 857 231) -->
    <g id="part-1-frame" transform="translate(140, 80)">
      <polygon points="0,50 140,0 360,80 220,130" fill="none" stroke="#1e293b" stroke-width="2.2" />
      <polygon points="0,50 0,70 220,150 220,130" fill="#334155" stroke="#1e293b" stroke-width="2.2" />
      <polygon points="220,130 220,150 360,100 360,80" fill="#1e293b" stroke="#1e293b" stroke-width="2.2" />
      <!-- 4 ouvertures rectangulaires pour interrupteurs à bascule -->
      <polygon points="40,55 70,44 85,55 55,66" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
      <polygon points="100,55 130,44 145,55 115,66" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
      <polygon points="160,55 190,44 205,55 175,66" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
      <polygon points="220,55 250,44 265,55 235,66" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
    </g>

    <!-- Traits verticaux d'explosion -->
    <line x1="200" y1="160" x2="200" y2="220" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" />
    <line x1="280" y1="170" x2="280" y2="230" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" />
    <line x1="360" y1="180" x2="360" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Repère 2 : Interrupteur Antibrouillard AR E18 (893 941 563) -->
    <g id="part-2-e18" transform="translate(160, 230)">
      <!-- Corps de l'interrupteur -->
      <polygon points="0,25 25,12 45,22 20,35" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="0,25 0,55 20,65 20,35" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="20,35 20,65 45,52 45,22" fill="#0f172a" stroke="#000000" stroke-width="1.8" />
      <!-- Bascule avec témoin ambre/jaune -->
      <polygon points="4,23 23,13 41,21 22,31" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
      <!-- Voyant orange antibrouillard -->
      <ellipse cx="22" cy="22" rx="4" ry="2.5" fill="#f59e0b" stroke="#b45309" stroke-width="0.8" />
      <!-- Pictogramme feux brouillard -->
      <path d="M 12 20 L 16 18 M 12 23 L 16 21 M 12 26 L 16 24" stroke="#f8fafc" stroke-width="0.9" />
      <!-- Broches arrière (31, +, 83b, 58b) -->
      <line x1="5" y1="58" x2="5" y2="70" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="15" y1="62" x2="15" y2="74" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="35" y1="53" x2="35" y2="65" stroke="#94a3b8" stroke-width="1.5" />
      <text x="3" y="10" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#0f172a">E18</text>
    </g>

    <!-- Repère 3 : Interrupteur Dégivrage lunette AR E15 (893 941 503) -->
    <g id="part-3-e15" transform="translate(245, 240)">
      <polygon points="0,25 25,12 45,22 20,35" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="0,25 0,55 20,65 20,35" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="20,35 20,65 45,52 45,22" fill="#0f172a" stroke="#000000" stroke-width="1.8" />
      <polygon points="4,23 23,13 41,21 22,31" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
      <!-- Voyant orange dégivrage -->
      <ellipse cx="22" cy="22" rx="4" ry="2.5" fill="#f59e0b" stroke="#b45309" stroke-width="0.8" />
      <!-- Symbol serpentins dégivrage -->
      <path d="M 12 18 Q 15 20 18 18 M 12 23 Q 15 25 18 23" fill="none" stroke="#f8fafc" stroke-width="0.9" />
      <!-- Broches arrière -->
      <line x1="5" y1="58" x2="5" y2="70" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="15" y1="62" x2="15" y2="74" stroke="#94a3b8" stroke-width="1.5" />
      <text x="3" y="10" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#0f172a">E15</text>
    </g>

    <!-- Repère 4 : Interrupteur Feux de Détresse E3 (893 953 235) -->
    <g id="part-4-e3" transform="translate(330, 250)">
      <polygon points="0,25 25,12 45,22 20,35" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="0,25 0,55 20,65 20,35" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="20,35 20,65 45,52 45,22" fill="#0f172a" stroke="#000000" stroke-width="1.8" />
      <!-- Bascule rouge triangle -->
      <polygon points="4,23 23,13 41,21 22,31" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
      <!-- Triangle warning blanc -->
      <polygon points="22,18 17,25 27,25" fill="#ffffff" />
      <line x1="5" y1="58" x2="5" y2="70" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="15" y1="62" x2="15" y2="74" stroke="#94a3b8" stroke-width="1.5" />
      <text x="3" y="10" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#0f172a">E3</text>
    </g>

    <!-- Repère 5 : Prises faisceau femelles verrouillées (T6b, T7a) -->
    <g id="part-5-connectors" transform="translate(190, 390)">
      <!-- Prise femelle 6 broches T6b (pour E18) -->
      <g transform="translate(0, 0)">
        <polygon points="0,15 30,2 50,11 20,24" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="0,15 0,35 20,44 20,24" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="20,24 20,44 50,31 50,11" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
        <!-- Fils vers E18 : ro/sw (+12V S1), gr/ws (vers L20), br (masse 32), gr/bl (éclairage) -->
        <path d="M 5 30 Q -10 60 -20 100" stroke="#ef4444" stroke-width="3" fill="none" />
        <path d="M 12 34 Q 5 65 0 100" stroke="#94a3b8" stroke-width="3" fill="none" />
        <path d="M 25 32 Q 25 65 25 100" stroke="#78350f" stroke-width="3" fill="none" />
        <text x="12" y="15" font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">T6b</text>
      </g>

      <!-- Prise femelle 7 broches T7a (pour E15) -->
      <g transform="translate(90, 15)">
        <polygon points="0,15 30,2 50,11 20,24" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="0,15 0,35 20,44 20,24" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="20,24 20,44 50,31 50,11" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
        <!-- Fils vers dégivrage -->
        <path d="M 5 30 Q 5 60 10 90" stroke="#10b981" stroke-width="3.5" fill="none" />
        <path d="M 15 34 Q 25 65 30 90" stroke="#78350f" stroke-width="3.5" fill="none" />
        <text x="12" y="15" font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">T7a</text>
      </g>
    </g>

    <!-- ==================== BULLES ET LIGNES ETKA ==================== -->
    <line x1="90" y1="120" x2="220" y2="105" class="etka-leader" />
    <circle cx="220" cy="105" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="120" r="13" class="etka-bubble" />
    <text x="75" y="120" class="etka-bubble-num">1</text>

    <!-- Repère 2 : E18 -->
    <line x1="90" y1="260" x2="180" y2="260" class="etka-leader" />
    <circle cx="180" cy="260" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="260" r="13" class="etka-bubble" />
    <text x="75" y="260" class="etka-bubble-num">2</text>

    <!-- Repère 3 : E15 -->
    <line x1="490" y1="240" x2="290" y2="265" class="etka-leader" />
    <circle cx="290" cy="265" r="3" class="etka-leader-dot" />
    <circle cx="505" cy="240" r="13" class="etka-bubble" />
    <text x="505" y="240" class="etka-bubble-num">3</text>

    <!-- Repère 4 : E3 -->
    <line x1="490" y1="310" x2="375" y2="280" class="etka-leader" />
    <circle cx="375" cy="280" r="3" class="etka-leader-dot" />
    <circle cx="505" cy="310" r="13" class="etka-bubble" />
    <text x="505" y="310" class="etka-bubble-num">4</text>

    <!-- Repère 5 : T6b -->
    <line x1="90" y1="410" x2="200" y2="415" class="etka-leader" />
    <circle cx="200" cy="415" r="3" class="etka-leader-dot" />
    <circle cx="75" cy="410" r="13" class="etka-bubble" />
    <text x="75" y="410" class="etka-bubble-num">5</text>

  </g>

  <!-- ==================== NOMENCLATURE OFFICIELLE VAG ==================== -->
  <g transform="translate(615, 80)">
    <rect width="310" height="560" class="etka-card-box" />
    <rect width="310" height="30" fill="#f1f5f9" rx="6" />
    <text x="12" y="20" class="etka-tbl-hdr">NOMENCLATURE PIÈCES · BILDTAFEL 959-00</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#cbd5e1" />

    <text x="12" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">REP</text>
    <text x="44" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">RÉFÉRENCE OEM</text>
    <text x="170" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">DÉSIGNATION</text>
    <line x1="0" y1="52" x2="310" y2="52" stroke="#e2e8f0" />

    <!-- Ligne 1 -->
    <text x="16" y="74" class="etka-tbl-ref">1</text>
    <text x="44" y="74" class="etka-tbl-ref">893 857 231</text>
    <text x="170" y="74" class="etka-tbl-row">Cadre console</text>
    <text x="44" y="87" class="etka-subtitle">Rahmen für Schalter Konsole</text>
    <line x1="8" y1="94" x2="302" y2="94" stroke="#f1f5f9" />

    <!-- Ligne 2 : E18 -->
    <text x="16" y="112" class="etka-tbl-ref">2</text>
    <text x="44" y="112" class="etka-tbl-ref">893 941 563</text>
    <text x="170" y="112" class="etka-tbl-row">Interrupteur E18</text>
    <text x="44" y="125" class="etka-subtitle">Schalter für Nebelschlussleuchte</text>
    <line x1="8" y1="132" x2="302" y2="132" stroke="#f1f5f9" />

    <!-- Ligne 3 : E15 -->
    <text x="16" y="150" class="etka-tbl-ref">3</text>
    <text x="44" y="150" class="etka-tbl-ref">893 941 503</text>
    <text x="170" y="150" class="etka-tbl-row">Interrupteur E15</text>
    <text x="44" y="163" class="etka-subtitle">Schalter für heizbare Heckscheibe</text>
    <line x1="8" y1="170" x2="302" y2="170" stroke="#f1f5f9" />

    <!-- Ligne 4 : E3 -->
    <text x="16" y="188" class="etka-tbl-ref">4</text>
    <text x="44" y="188" class="etka-tbl-ref">893 953 235</text>
    <text x="170" y="188" class="etka-tbl-row">Interrupteur E3</text>
    <text x="44" y="201" class="etka-subtitle">Warnlichtschalter (Détresse)</text>
    <line x1="8" y1="208" x2="302" y2="208" stroke="#f1f5f9" />

    <!-- Ligne 5 : T6b -->
    <text x="16" y="226" class="etka-tbl-ref">5</text>
    <text x="44" y="226" class="etka-tbl-ref">443 971 984</text>
    <text x="170" y="226" class="etka-tbl-row">Prise 6 broches</text>
    <text x="44" y="239" class="etka-subtitle">Steckergehäuse T6b schwarz</text>
    <line x1="8" y1="246" x2="302" y2="246" stroke="#f1f5f9" />

    <!-- Schéma de câblage E18 / Test multimètre -->
    <g transform="translate(10, 270)">
      <rect width="290" height="275" fill="#eff6ff" stroke="#bfdbfe" rx="5" />
      <text x="10" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#1e40af">CIRCUIT ANTIBROUILLARD E18 (RTA 121)</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Alimentation : Fusible S1 (15A) boîte fusibles</text>
      <text x="10" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Borne 30/15 vers E18 : Fil ro/sw (+12V contact)</text>
      <text x="10" y="62" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Borne 83b sortie E18 : Fil gr/ws (1.0 mm²)</text>
      <text x="10" y="76" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Traverse connecteur T10b broche 5 (orange)</text>
      <text x="10" y="90" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Rejoint connecteur T6a broche 3 (aile AR G)</text>
      <text x="10" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Arrive à l'ampoule L20 (21W) malle AR gauche</text>
      <text x="10" y="118" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">• Retour masse fil br vers masse malle (98)</text>
      <text x="10" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#b91c1c">PROTOCOLE DE TEST SUR CONNECTEUR T6b :</text>
      <text x="10" y="152" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">1. Voltmètre entre fil ro/sw et masse (32) :</text>
      <text x="10" y="166" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">   Attendu : 12.6V avec feux de croisement allumés</text>
      <text x="10" y="180" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">2. Bouton E18 enclenché, tester borne 83b (gr/ws) :</text>
      <text x="10" y="194" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">   Attendu : 12.6V (si 0V, remplacer E18 893941563)</text>
      <text x="10" y="208" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">3. Continuité fil gr/ws entre T6b et T6a/3 :</text>
      <text x="10" y="222" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">   Attendu : &lt; 0.5 Ω (vérifie faisceau de caisse)</text>
      <text x="10" y="236" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">4. Continuité charnière de coffre vers ampoule L20 :</text>
      <text x="10" y="250" font-family="ui-monospace, monospace" font-size="8.5" fill="#b91c1c">   Zone fragile : flexion dans le soufflet de malle</text>
      <text x="10" y="264" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">5. RTA page 121 : Schéma usine options &amp; E18</text>
    </g>
  </g>
</svg>
