<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <defs>
    <style>
      .etka-bg { fill: #f8fafc; }
      .etka-title { font-family: ui-monospace, monospace; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .etka-subtitle { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .etka-leader { stroke: #dc2626; stroke-width: 1.3; fill: none; }
      .etka-leader-dot { fill: #dc2626; }
      .etka-bubble { fill: #dc2626; stroke: #ffffff; stroke-width: 1.5; }
      .etka-bubble-num { font-family: ui-monospace, monospace; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .etka-card-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .etka-tbl-hdr { font-family: ui-monospace, monospace; font-size: 11px; font-weight: bold; fill: #334155; }
      .etka-tbl-row { font-family: ui-monospace, monospace; font-size: 10.5px; fill: #475569; }
      .etka-tbl-ref { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="960" height="680" class="etka-bg" />
  <rect x="16" y="16" width="928" height="648" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="20" y="20" width="920" height="640" fill="none" stroke="#cbd5e1" stroke-width="0.8" />

  <path d="M 20 62 L 940 62" stroke="#94a3b8" stroke-width="1.2" />
  <text x="36" y="42" class="etka-title">AUDI 80 / 90 / AVANT (1987-1991) · GROUPE 9 : ÉQUIPEMENT ÉLECTRIQUE</text>
  <text x="36" y="56" class="etka-subtitle">PLANCHE ISOMÉTRIQUE ATELIER N° 945-00 · FEUX ARRIÈRE, FEU ANTIBROUILLARD L20, FAISCEAU CHARNIÈRE &amp; CONNECTEUR T6a</text>
  <text x="760" y="46" font-family="ui-monospace, monospace" font-size="13px" font-weight="bold" fill="#dc2626">BILDTAFEL 945-00</text>

  <!-- ==================== VUE ÉCLATÉE ISOMÉTRIQUE ==================== -->
  <g transform="translate(40, 20)">

    <!-- Repère 1 : Bloc optique arrière extérieur gauche (sur aile AR) (893 945 217) -->
    <g id="part-1-outer-light" transform="translate(130, 90)">
      <polygon points="0,35 60,10 130,35 70,60" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.8" />
      <polygon points="0,35 0,65 70,90 70,60" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.8" />
      <polygon points="70,60 70,90 130,65 130,35" fill="#ea580c" stroke="#c2410c" stroke-width="1.8" />
      <!-- Striations lentille -->
      <line x1="20" y1="42" x2="20" y2="72" stroke="#fca5a5" stroke-width="1" />
      <line x1="45" y1="51" x2="45" y2="81" stroke="#fca5a5" stroke-width="1" />
      <line x1="95" y1="50" x2="95" y2="78" stroke="#fed7aa" stroke-width="1" />
    </g>

    <!-- Repère 2 : Bloc optique intérieur sur couvercle de malle (893 945 223) avec antibrouillard L20 -->
    <g id="part-2-inner-light" transform="translate(290, 110)">
      <polygon points="0,25 70,0 140,25 70,50" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.8" />
      <polygon points="0,25 0,55 70,80 70,50" fill="#dc2626" stroke="#450a0a" stroke-width="1.8" />
      <polygon points="70,50 70,80 140,55 140,25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
      <!-- Zone antibrouillard L20 rouge vif -->
      <polygon points="10,30 60,12 60,40 10,58" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2" />
      <text x="25" y="40" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ffffff">L20</text>
      <!-- Zone feux de recul transparent/blanc -->
      <polygon points="75,48 130,28 130,48 75,68" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="92" y="47" font-family="ui-monospace, monospace" font-size="7" fill="#475569">M16</text>
    </g>

    <!-- Repère 3 : Platine porte-lampes avec ampoules à baïonnette P21W -->
    <g id="part-3-holder" transform="translate(250, 240)">
      <polygon points="0,30 80,0 160,30 80,60" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="0,30 0,45 80,75 80,60" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <!-- Ampoule antibrouillard P21W (Repère 4) -->
      <circle cx="50" cy="25" r="9" fill="rgba(254, 240, 138, 0.7)" stroke="#ca8a04" stroke-width="1.2" />
      <!-- Culot métal BA15s -->
      <cylinder cx="50" cy="25" r="4" />
      <circle cx="50" cy="25" r="4.5" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <!-- Pistes imprimées en tôle cuivrée -->
      <path d="M 30 35 L 70 20 L 120 38" stroke="#ca8a04" stroke-width="1.5" fill="none" />
    </g>

    <!-- Repère 5 : Faisceau articulé et soufflet passe-fils charnière de coffre -->
    <g id="part-5-bellows" transform="translate(180, 360)">
      <!-- Soufflet accordéon caoutchouc (zone d'usure critique) -->
      <ellipse cx="60" cy="30" rx="14" ry="22" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <ellipse cx="80" cy="35" rx="14" ry="22" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <ellipse cx="100" cy="40" rx="14" ry="22" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <ellipse cx="120" cy="45" rx="14" ry="22" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <!-- Faisceau traversant avec fils : gr/ws (antibrouillard L20), sw/bl (feux recul), br (masse 98) -->
      <path d="M 0 10 Q 50 25 150 55" stroke="#94a3b8" stroke-width="4" fill="none" />
      <path d="M 0 18 Q 50 33 150 63" stroke="#ef4444" stroke-width="4" fill="none" />
      <path d="M 0 26 Q 50 41 150 71" stroke="#78350f" stroke-width="4" fill="none" />
      <!-- Alerte rupture fil charnière -->
      <rect x="155" y="45" width="90" height="26" fill="#fef2f2" stroke="#ef4444" rx="4" />
      <text x="162" y="61" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#dc2626">ZONE FRAGILE !</text>
    </g>

    <!-- Repère 6 : Connecteur T6a NOIR 6 broches (flanc d'aile AR gauche) -->
    <g id="part-6-t6a" transform="translate(150, 480)">
      <polygon points="0,20 30,5 55,15 25,30" fill="#334155" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="0,20 0,40 25,50 25,30" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" />
      <polygon points="25,30 25,50 55,40 55,15" fill="#0f172a" stroke="#000000" stroke-width="1.8" />
      <!-- 6 alvéoles -->
      <circle cx="10" cy="26" r="1.5" fill="#f8fafc" />
      <circle cx="18" cy="22" r="1.5" fill="#f8fafc" />
      <circle cx="26" cy="18" r="1.5" fill="#f8fafc" />
      <circle cx="15" cy="34" r="1.5" fill="#f8fafc" />
      <circle cx="23" cy="30" r="1.5" fill="#f8fafc" />
      <circle cx="31" cy="26" r="1.5" fill="#f8fafc" />
      <text x="8" y="14" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#0f172a">T6a</text>
    </g>

    <!-- Repère 7 : Borne de masse étoile (98) sur caisse d'aile AR gauche -->
    <g id="part-7-ground-98" transform="translate(320, 480)">
      <!-- Goujon soudé à la tôle M6 -->
      <circle cx="25" cy="25" r="16" fill="#cbd5e1" stroke="#475569" stroke-width="1.8" />
      <!-- Cosse ronde à œillet vissée avec écrou 10mm -->
      <polygon points="25,17 32,21 32,29 25,33 18,29 18,21" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
      <!-- Rayonnement de fils marrons de masse (br) -->
      <line x1="25" y1="25" x2="5" y2="45" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <line x1="25" y1="25" x2="35" y2="55" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <line x1="25" y1="25" x2="48" y2="35" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
      <text x="14" y="10" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#78350f">Masse (98)</text>
    </g>

    <!-- ==================== BULLES ET LIGNES ETKA ==================== -->
    <!-- Repère 1 : Feu extérieur -->
    <line x1="80" y1="120" x2="160" y2="125" class="etka-leader" />
    <circle cx="160" cy="125" r="3" class="etka-leader-dot" />
    <circle cx="65" cy="120" r="13" class="etka-bubble" />
    <text x="65" y="120" class="etka-bubble-num">1</text>

    <!-- Repère 2 : Feu malle & L20 -->
    <line x1="490" y1="130" x2="380" y2="135" class="etka-leader" />
    <circle cx="380" cy="135" r="3" class="etka-leader-dot" />
    <circle cx="505" cy="130" r="13" class="etka-bubble" />
    <text x="505" y="130" class="etka-bubble-num">2</text>

    <!-- Repère 4 : Ampoule P21W L20 -->
    <line x1="490" y1="260" x2="310" y2="265" class="etka-leader" />
    <circle cx="310" cy="265" r="3" class="etka-leader-dot" />
    <circle cx="505" cy="260" r="13" class="etka-bubble" />
    <text x="505" y="260" class="etka-bubble-num">4</text>

    <!-- Repère 5 : Soufflet charnière -->
    <line x1="80" y1="380" x2="180" y2="390" class="etka-leader" />
    <circle cx="180" cy="390" r="3" class="etka-leader-dot" />
    <circle cx="65" cy="380" r="13" class="etka-bubble" />
    <text x="65" y="380" class="etka-bubble-num">5</text>

    <!-- Repère 6 : Connecteur T6a -->
    <line x1="80" y1="500" x2="155" y2="505" class="etka-leader" />
    <circle cx="155" cy="505" r="3" class="etka-leader-dot" />
    <circle cx="65" cy="500" r="13" class="etka-bubble" />
    <text x="65" y="500" class="etka-bubble-num">6</text>

    <!-- Repère 7 : Masse (98) -->
    <line x1="490" y1="500" x2="350" y2="505" class="etka-leader" />
    <circle cx="350" cy="505" r="3" class="etka-leader-dot" />
    <circle cx="505" cy="500" r="13" class="etka-bubble" />
    <text x="505" y="500" class="etka-bubble-num">7</text>

  </g>

  <!-- ==================== NOMENCLATURE OFFICIELLE VAG ==================== -->
  <g transform="translate(615, 80)">
    <rect width="310" height="560" class="etka-card-box" />
    <rect width="310" height="30" fill="#f1f5f9" rx="6" />
    <text x="12" y="20" class="etka-tbl-hdr">NOMENCLATURE PIÈCES · BILDTAFEL 945-00</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#cbd5e1" />

    <text x="12" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">REP</text>
    <text x="44" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">RÉFÉRENCE OEM</text>
    <text x="170" y="46" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">DÉSIGNATION</text>
    <line x1="0" y1="52" x2="310" y2="52" stroke="#e2e8f0" />

    <!-- Ligne 1 : Feu extérieur -->
    <text x="16" y="74" class="etka-tbl-ref">1</text>
    <text x="44" y="74" class="etka-tbl-ref">893 945 217</text>
    <text x="170" y="74" class="etka-tbl-row">Feu AR aile G</text>
    <text x="44" y="87" class="etka-subtitle">Schlussleuchte links Kotflügel</text>
    <line x1="8" y1="94" x2="302" y2="94" stroke="#f1f5f9" />

    <!-- Ligne 2 : Feu intérieur malle -->
    <text x="16" y="112" class="etka-tbl-ref">2</text>
    <text x="44" y="112" class="etka-tbl-ref">893 945 223</text>
    <text x="170" y="112" class="etka-tbl-row">Feu malle G (L20)</text>
    <text x="44" y="125" class="etka-subtitle">Nebelschlussleuchte Heckklappe</text>
    <line x1="8" y1="132" x2="302" y2="132" stroke="#f1f5f9" />

    <!-- Ligne 3 : Porte-lampes -->
    <text x="16" y="150" class="etka-tbl-ref">3</text>
    <text x="44" y="150" class="etka-tbl-ref">893 945 231</text>
    <text x="170" y="150" class="etka-tbl-row">Porte-lampes malle</text>
    <text x="44" y="163" class="etka-subtitle">Lampenträger Heckklappe links</text>
    <line x1="8" y1="170" x2="302" y2="170" stroke="#f1f5f9" />

    <!-- Ligne 4 : Ampoule P21W -->
    <text x="16" y="188" class="etka-tbl-ref">4</text>
    <text x="44" y="188" class="etka-tbl-ref">N 017 732 2</text>
    <text x="170" y="188" class="etka-tbl-row">Ampoule 12V 21W</text>
    <text x="44" y="201" class="etka-subtitle">Glühlampe BA15s (L20 / M16)</text>
    <line x1="8" y1="208" x2="302" y2="208" stroke="#f1f5f9" />

    <!-- Ligne 5 : Soufflet -->
    <text x="16" y="226" class="etka-tbl-ref">5</text>
    <text x="44" y="226" class="etka-tbl-ref">893 971 840</text>
    <text x="170" y="226" class="etka-tbl-row">Soufflet malle</text>
    <text x="44" y="239" class="etka-subtitle">Faltenbalg für Leitungsstrang</text>
    <line x1="8" y1="246" x2="302" y2="246" stroke="#f1f5f9" />

    <!-- Ligne 6 : T6a -->
    <text x="16" y="264" class="etka-tbl-ref">6</text>
    <text x="44" y="264" class="etka-tbl-ref">893 971 976</text>
    <text x="170" y="264" class="etka-tbl-row">Prise 6 broches T6a</text>
    <text x="44" y="277" class="etka-subtitle">Steckergehäuse T6a schwarz</text>
    <line x1="8" y1="284" x2="302" y2="284" stroke="#f1f5f9" />

    <!-- Guide panne classique charnière malle -->
    <g transform="translate(10, 310)">
      <rect width="290" height="235" fill="#fef2f2" stroke="#fecaca" rx="5" />
      <text x="10" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#991b1b">PANNE N°1 AUDI 80 B3 : COFFRE</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#7f1d1d">• Symptôme : Antibrouillard L20 ou feux de recul</text>
      <text x="10" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#7f1d1d">   inopérants malgré fusible S1 et ampoule OK.</text>
      <text x="10" y="66" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#1e3a8a">LOCALISATION EXACTE :</text>
      <text x="10" y="82" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">Le faisceau passe de l'aile AR gauche au capot</text>
      <text x="10" y="96" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">de malle via le soufflet caoutchouc (5).</text>
      <text x="10" y="112" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">Les fils de cuivre se rompent par fatigue sous</text>
      <text x="10" y="126" font-family="ui-monospace, monospace" font-size="9" fill="#1e3a8a">l'isolant lors des ouvertures répétées.</text>
      <text x="10" y="146" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#15803d">TEST EN 2 MINUTES :</text>
      <text x="10" y="162" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">1. Débrancher connecteur T6a (flanc aile G).</text>
      <text x="10" y="176" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">2. Mesurer 12V sur T6a/3 côté faisceau habitacle.</text>
      <text x="10" y="190" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">3. Si 12V est présent sur T6a mais absent à la douille,</text>
      <text x="10" y="204" font-family="ui-monospace, monospace" font-size="8.5" fill="#b91c1c">   la coupure est dans le soufflet 893 971 840.</text>
      <text x="10" y="222" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e3a8a">RTA page 120 (Masse 98) &amp; page 121 (Circuit malle)</text>
    </g>
  </g>
</svg>
